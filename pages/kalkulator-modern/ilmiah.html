<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Bantuin — Kalkulator Ilmiah</title>
<link rel="icon" type="image/png" href="../../assets/favicon.png">
<link rel="stylesheet" href="../../css/style.css">
<style>
/* ============================
   LAYOUT UTAMA
============================= */
.calc-page{
  display:flex; flex-direction:column; height:100dvh;
  background:var(--bg);
}

/* ============================
   DISPLAY (layar hasil)
============================= */
.calc-display{
  flex:0 0 auto;
  background:var(--surface);
  border-bottom:1px solid var(--border);
  padding:52px 18px 14px;   /* 52px = ruang untuk page-head fixed */
  min-height:130px;
  display:flex; flex-direction:column; justify-content:flex-end; align-items:flex-end;
}
.calc-expr{
  font-size:15px; color:var(--text-soft); min-height:20px;
  text-align:right; word-break:break-all; line-height:1.4;
  font-family:'Inter',sans-serif; max-height:56px; overflow:hidden;
}
.calc-result{
  font-family:'Poppins',sans-serif; font-weight:700;
  font-size:36px; color:var(--text); line-height:1.1;
  text-align:right; word-break:break-all;
  transition:font-size .15s;
}
.calc-result.small{ font-size:26px; }
.calc-result.xsmall{ font-size:20px; }

/* ============================
   TOOLBAR ATAS KEYBOARD (riwayat + nav)
============================= */
.kb-topbar{
  display:flex; align-items:center; gap:0;
  background:var(--surface); border-bottom:1px solid var(--border);
  padding:0 4px; height:44px;
}
.kb-topbar-btn{
  flex:0 0 auto; width:44px; height:44px;
  display:flex; align-items:center; justify-content:center;
  border:none; background:transparent; color:var(--text-soft);
  border-radius:10px; font-size:20px; cursor:pointer;
}
.kb-topbar-btn:active{ background:var(--surface-2); }
.kb-topbar-sep{ flex:1; }

/* ============================
   TAB KEYBOARD (pilih panel)
============================= */
.kb-tabs{
  display:flex; gap:8px; padding:8px 10px 0;
  background:var(--surface); overflow-x:auto;
  scrollbar-width:none;
}
.kb-tabs::-webkit-scrollbar{ display:none; }
.kb-tab{
  flex:0 0 auto; border:1.5px solid var(--border);
  background:var(--surface-2); color:var(--text-soft);
  border-radius:99px; padding:5px 14px;
  font-size:12.5px; font-weight:600; cursor:pointer;
  white-space:nowrap; transition:.15s;
  font-family:'Inter',sans-serif;
}
.kb-tab.active{
  background:var(--text); color:var(--surface);
  border-color:var(--text);
}
.kb-tab:active{ opacity:.75; }

/* ============================
   PANEL KEYBOARD
============================= */
.kb-panels{
  flex:1 1 auto; overflow:hidden; background:var(--surface);
  padding:6px 4px 8px;
}
.kb-panel{ display:none; }
.kb-panel.active{ display:grid; }

/* Panel 1 — operator dasar: 4 kolom */
.kb-panel.op{ grid-template-columns:repeat(4,1fr); gap:4px; }
/* Panel 2 — f(x)/log/ln: 6 kolom */
.kb-panel.fn{ grid-template-columns:repeat(6,1fr); gap:3px; }
/* Panel 3 — abc: 8 kolom */
.kb-panel.abc{ grid-template-columns:repeat(8,1fr); gap:3px; }

/* ============================
   TOMBOL KEYBOARD
============================= */
.kb-key{
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  border:1px solid var(--border);
  border-radius:10px; background:var(--surface-2);
  color:var(--text); cursor:pointer;
  font-family:'Inter',sans-serif;
  transition:background .1s, transform .08s;
  position:relative; min-height:52px;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
.kb-key:active{ background:var(--border); transform:scale(.94); }

/* Tombol angka — putih/surface lebih cerah */
.kb-key.num{ background:var(--surface); }
.kb-key.num:active{ background:var(--surface-2); }

/* Tombol operator utama — oranye */
.kb-key.op-main{
  background:var(--orange); color:#fff; border-color:var(--orange-dark);
}
.kb-key.op-main:active{ background:var(--orange-dark); }

/* Tombol hapus — merah lembut */
.kb-key.del{
  background:rgba(224,71,61,.12); color:var(--danger); border-color:rgba(224,71,61,.25);
}
.kb-key.del:active{ background:rgba(224,71,61,.22); }

/* Ukuran teks tombol */
.kb-key .kl{
  font-size:17px; font-weight:600; line-height:1;
}
.kb-key .kl.math{
  font-size:15px;
}
.kb-key .kl.small{
  font-size:12px;
}
/* Sub-label (subscript kecil di bawah simbol) */
.kb-key .ksub{
  font-size:9px; color:var(--text-soft); margin-top:1px; line-height:1;
}
.kb-key.op-main .ksub{ color:rgba(255,255,255,.7); }

/* Tombol span 2 kolom (= dan enter) */
.kb-key.span2{ grid-column:span 2; }

/* ============================
   TOMBOL HAPUS SVG
============================= */
.kb-key.del svg{ color:var(--danger); }

/* ============================
   PANEL ABC — huruf lebih kecil
============================= */
.kb-panel.abc .kb-key{ min-height:44px; border-radius:8px; }
.kb-panel.abc .kl{ font-size:15px; }

/* ============================
   RESPONSIVE — kalau layar sempit
============================= */
@media(max-height:680px){
  .calc-display{ min-height:100px; padding-top:52px; }
  .kb-key{ min-height:44px; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="page-head" style="position:fixed;top:0;left:0;right:0;z-index:100">
  <button class="back-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>

<script src="../../js/store.js"></script>
<script src="../../js/util.js"></script>
<script>
applyStoredTheme();

/* ================================================================
   STATE
================================================================ */
let expr = '';          // ekspresi yang diketik
let cursor = 0;         // posisi kursor dalam expr
let lastResult = null;  // hasil terakhir
let history = [];       // riwayat perhitungan
let abcMode = false;    // apakah tab abc sedang aktif
let activeTab = 'op';   // tab aktif saat ini (op / fn)

/* ================================================================
   ELEMENT REFS
================================================================ */
const elExpr   = document.getElementById('calcExpr');
const elResult = document.getElementById('calcResult');
const elTabs   = document.getElementById('kbTabs');

/* ================================================================
   RENDER DISPLAY
================================================================ */
function render(){
  // Tampilkan ekspresi dengan kursor (|)
  const shown = expr.slice(0,cursor) + '|' + expr.slice(cursor);
  elExpr.textContent = shown;

  // Preview hasil saat mengetik (live eval)
  if(expr.trim()){
    try{
      const val = evalExpr(expr);
      if(val !== null && val !== undefined && !isNaN(val)){
        const str = formatNum(val);
        elResult.textContent = str;
        elResult.className = 'calc-result' + (str.length > 14 ? ' xsmall' : str.length > 10 ? ' small' : '');
      } else {
        elResult.textContent = lastResult !== null ? formatNum(lastResult) : '0';
        elResult.className = 'calc-result';
      }
    }catch(e){
      elResult.textContent = lastResult !== null ? formatNum(lastResult) : '0';
      elResult.className = 'calc-result';
    }
  } else {
    elResult.textContent = lastResult !== null ? formatNum(lastResult) : '0';
    elResult.className = 'calc-result';
  }
}

function formatNum(n){
  if(typeof n !== 'number') return String(n);
  if(!isFinite(n)) return n > 0 ? '∞' : '-∞';
  // Bulatkan floating point error
  const rounded = parseFloat(n.toPrecision(12));
  // Format ribuan dengan titik, desimal dengan koma (Indonesia)
  return rounded.toLocaleString('id-ID', {maximumFractionDigits: 10});
}

/* ================================================================
   EVALUASI EKSPRESI
================================================================ */
function evalExpr(raw){
  // Normalisasi simbol
  let s = raw
    .replace(/×/g, '*')
    .replace(/÷/g, '/')
    .replace(/−/g, '-')
    .replace(/,/g, '.')        // koma desimal → titik
    .replace(/π/g, 'Math.PI')
    .replace(/log₁₀\(/g, 'Math.log10(')
    .replace(/log₂\(/g, 'Math.log2(')
    .replace(/log\(/g, 'Math.log10(')   // log tanpa basis = log10
    .replace(/ln\(/g, 'Math.log(')
    .replace(/exp\(/g, 'Math.exp(')
    .replace(/√\(/g, 'Math.sqrt(')
    .replace(/sin\(/g, 'Math.sin(')
    .replace(/cos\(/g, 'Math.cos(')
    .replace(/tan\(/g, 'Math.tan(')
    .replace(/\|([^|]+)\|/g, 'Math.abs($1)')
    .replace(/(\d+)!/g, (m,n)=>factorial(parseInt(n)))
    .replace(/e(?!\d)/g, 'Math.E')
    .replace(/%/g, '/100');

  // Kalikan implisit: 2( → 2*(
  s = s.replace(/(\d)\(/g, '$1*(');

  // Buang karakter yang tidak aman
  if(/[a-wyzA-Z_$]/i.test(s.replace(/Math\./g,'').replace(/PI|E|abs|sqrt|log|exp|sin|cos|tan|log10|log2/g,''))) return null;

  // eslint-disable-next-line no-new-func
  return Function('"use strict"; return (' + s + ')')();
}

function factorial(n){
  if(n < 0 || !Number.isInteger(n)) return NaN;
  if(n > 170) return Infinity;
  let r = 1;
  for(let i=2;i<=n;i++) r*=i;
  return r;
}

/* ================================================================
   AKSI KEYBOARD
================================================================ */
window.ins = function(ch){
  // Ganti placeholder □ dengan posisi kursor
  expr = expr.slice(0,cursor) + ch + expr.slice(cursor);
  cursor += ch.length;
  render();
};

window.backspace = function(){
  if(cursor > 0){
    expr = expr.slice(0,cursor-1) + expr.slice(cursor);
    cursor--;
    render();
  }
};

window.clearAll = function(){
  expr = ''; cursor = 0; lastResult = null;
  elResult.textContent = '0';
  elResult.className = 'calc-result';
  elExpr.textContent = '';
};

window.moveCursor = function(dir){
  cursor = Math.max(0, Math.min(expr.length, cursor + dir));
  render();
};

window.calculate = function(){
  if(!expr.trim()) return;
  try{
    const val = evalExpr(expr);
    if(val === null || isNaN(val) || !isFinite(val)){
      showToast('Ekspresi tidak valid');
      return;
    }
    // Simpan ke riwayat
    history.unshift({ expr: expr, result: val, time: Date.now() });
    if(history.length > 50) history.pop();

    lastResult = val;
    const str = formatNum(val);
    elExpr.textContent = expr + ' =';
    elResult.textContent = str;
    elResult.className = 'calc-result' + (str.length > 14 ? ' xsmall' : str.length > 10 ? ' small' : '');

    // Set ekspresi jadi hasil supaya bisa lanjut menghitung
    expr = String(val).replace('.',',');
    cursor = expr.length;
  }catch(e){
    showToast('Ekspresi tidak dapat dihitung');
  }
};

/* ================================================================
   TAB SWITCHING
================================================================ */
window.switchTab = function(tab, el){
  if(abcMode){ toggleAbc(); }          // tutup abc dulu kalau terbuka
  activeTab = tab;
  document.querySelectorAll('.kb-tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.kb-panel').forEach(p=>p.classList.remove('active'));
  document.getElementById('panel-'+tab).classList.add('active');
};

window.toggleAbc = function(){
  abcMode = !abcMode;
  const btn = document.getElementById('abcBtn');
  const abcPanel = document.getElementById('panel-abc');

  if(abcMode){
    // Sembunyikan panel aktif, tampilkan abc
    document.querySelectorAll('.kb-panel').forEach(p=>p.classList.remove('active'));
    abcPanel.classList.add('active');
    btn.style.background = 'var(--surface-2)';
    btn.style.borderRadius = '8px';
    // Hilangkan aktif dari tab lain
    document.querySelectorAll('.kb-tab').forEach(t=>t.classList.remove('active'));
  } else {
    // Kembali ke tab sebelumnya
    abcPanel.classList.remove('active');
    document.getElementById('panel-'+activeTab).classList.add('active');
    btn.style.background = '';
    // Kembalikan aktif ke tab sebelumnya
    const prevTab = document.querySelector('.kb-tab[data-tab="'+activeTab+'"]');
    if(prevTab) prevTab.classList.add('active');
  }
};

/* ================================================================
   RIWAYAT
================================================================ */
window.showHistory = function(){
  if(history.length === 0){ showToast('Belum ada riwayat'); return; }

  // Buat modal sederhana
  let existing = document.getElementById('histModal');
  if(existing) existing.remove();

  const modal = document.createElement('div');
  modal.id = 'histModal';
  modal.style.cssText = `
    position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.5);
    display:flex;align-items:flex-end;
  `;
  modal.innerHTML = `
    <div style="background:var(--surface);border-radius:20px 20px 0 0;
                width:100%;max-height:60vh;overflow-y:auto;padding:20px 16px 32px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <b style="font-size:15px">Riwayat</b>
        <div style="display:flex;gap:8px">
          <button onclick="clearHistory()" style="font-size:12px;background:transparent;border:1px solid var(--border);
            border-radius:8px;padding:5px 10px;color:var(--danger);cursor:pointer">Hapus semua</button>
          <button onclick="document.getElementById('histModal').remove()"
            style="font-size:12px;background:transparent;border:1px solid var(--border);
            border-radius:8px;padding:5px 10px;color:var(--text);cursor:pointer">Tutup</button>
        </div>
      </div>
      ${history.map((h,i)=>`
        <div onclick="useHistory(${i})" style="padding:10px 12px;border-radius:10px;
          background:var(--surface-2);margin-bottom:8px;cursor:pointer">
          <div style="font-size:13px;color:var(--text-soft)">${h.expr}</div>
          <div style="font-size:18px;font-weight:700;color:var(--text);font-family:'Poppins',sans-serif">
            = ${formatNum(h.result)}
          </div>
        </div>
      `).join('')}
    </div>
  `;
  modal.addEventListener('click', e=>{ if(e.target===modal) modal.remove(); });
  document.body.appendChild(modal);
};

window.useHistory = function(i){
  const h = history[i];
  expr = String(h.result).replace('.',',');
  cursor = expr.length;
  lastResult = h.result;
  document.getElementById('histModal')?.remove();
  render();
};

window.clearHistory = function(){
  history = [];
  document.getElementById('histModal')?.remove();
  showToast('Riwayat dihapus');
};

/* ================================================================
   INIT
================================================================ */
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bantuin — Konversi File</title>
<link rel="icon" type="image/png" href="../assets/favicon.png">
<link rel="stylesheet" href="../css/style.css">
<style>
.kb-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:4px 16px 40px;
}
.kb-card{
  background:var(--surface); border:1px solid var(--border); border-radius:14px;
  padding:12px; display:flex; align-items:center; gap:10px; cursor:pointer;
  transition:border-color .15s, transform .1s;
}
.kb-card:active{ transform:scale(.98); }
.kb-card:hover{ border-color:var(--orange); }
.kb-ic{
  width:36px; height:36px; border-radius:10px; flex-shrink:0;
  background:linear-gradient(145deg,var(--orange),var(--orange-dark));
  color:#fff; display:flex; align-items:center; justify-content:center; font-size:10.5px; font-weight:800;
}
.kb-card b{ font-size:12.5px; line-height:1.35; display:block; }
</style>
</head>
<body>

<div class="page-head">
  <button class="back-btn" onclick="window.location.href='../index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  </button>
  <h2>Konversi File</h2>
</div>

<div style="padding:74px 16px 4px;font-size:13px;color:var(--text-soft);line-height:1.6">
  Pilih jenis konversi file yang kamu butuhkan di bawah ini.
</div>

<div class="kb-grid" id="kdGrid"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/store.js"></script>
<script src="../js/util.js"></script>
<script>
applyStoredTheme();

// { type, title, tag }
const KD_LIST = [
  ['pdf2docx', 'PDF ke DOCX', 'PDF'],
  ['docx2pdf', 'DOCX ke PDF', 'DOC'],
  ['xlsx2csv', 'XLSX ke CSV', 'XLS'],
  ['csv2xlsx', 'CSV ke XLSX', 'CSV'],
];

function renderKD(){
  const grid = document.getElementById('kdGrid');
  grid.innerHTML = KD_LIST.map(([type,title,tag]) => `
    <div class="kb-card" onclick="openTool('${type}')">
      <div class="kb-ic">${tag}</div>
      <b>${title}</b>
    </div>
  `).join('');
}

function openTool(type){
  location.href = `konversi-dokumen/tool.html?type=${type}`;
}

renderKD();
</script>
</body>
</html>
